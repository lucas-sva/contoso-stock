services:
  app:
    container_name: contoso_app_dev
    image: mcr.microsoft.com/devcontainers/dotnet:10.0
    volumes:
      # Monta o diretório atual de trabalho para dentro do container
      - ..:/workspaces/contoso-stock:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: contoso_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ContosoStockDb
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: